<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Đăng nhập</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script>
        //gửi tới api.aspx?action=xin_muoi
        //lưu lại chuỗi muối
        function gui_di(f) {
            var uid = f.uid.value;
            var pwd = f.pwd.value;
            fetch("/api.aspx?action=xin_muoi")
                .then(response => response.json())
                .then(res => {
                    var my_muoi = res.data;
                    console.log("Muối ", my_muoi);
                    var hash = CryptoJS.SHA256(uid + my_muoi + pwd).toString();
                    console.log([uid, pwd, my_muoi, hash]);

                    const formData = new URLSearchParams();
                    formData.append("uid", uid);
                    formData.append("hash", hash);

                    fetch("/api.aspx?action=login", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/x-www-form-urlencoded"
                        },
                        body: formData
                    })
                        .then(response => response.json())
                        .then(res => {
                            console.log(res);
                        });
                });


        }
    </script>
</head>
<body>

    <form onsubmit="gui_di(this); return false;">

        <input type="text" id="uid" name="uid"><br />

        <label for="pwd">Password:</label>
        <input type="text" id="pwd" name="pwd">
